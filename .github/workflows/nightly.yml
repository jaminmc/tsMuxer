name: Nightly Releases

on:
  schedule:
    - cron: '1 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.check.outputs.status }}
      version: ${{ steps.check.outputs.version }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}

    steps:
    - uses: actions/checkout@v4
      name: checkout
      with:
        fetch-depth: 0

    - name: nightly-check
      id: check
      shell: bash {0}
      run: |
        set -e

        # Check if HEAD already has a nightly tag
        if git describe --tags --contains --match 'nightly-*' HEAD >/dev/null 2>&1; then
          # HEAD already tagged, skip build
          echo "status=1" >> $GITHUB_OUTPUT
          echo "skip_reason=HEAD already has nightly tag" >> $GITHUB_OUTPUT
          echo "::notice::Skipping nightly build - HEAD already has nightly tag"
          exit 0
        else
          # New code since last nightly, proceed with build
          ver="$(date +%Y-%m-%d-%H-%M-%S)"
          echo "status=0" >> $GITHUB_OUTPUT
          echo "version=${ver}" >> $GITHUB_OUTPUT
          echo "skip_reason=" >> $GITHUB_OUTPUT
          echo "::notice::Building nightly for version: ${ver}"
          exit 0
        fi

    - name: create-release
      id: create
      if: steps.check.outputs.status == 0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly-${{ steps.check.outputs.version }}
        name: Nightly build from ${{ steps.check.outputs.version }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Log workflow status
      if: always()
      run: |
        if [ "${{ steps.check.outputs.status }}" == "0" ]; then
          echo "::notice::Nightly check passed, proceeding to build"
        else
          echo "::notice::Nightly check skipped: ${{ steps.check.outputs.skip_reason }}"
        fi

  build-linux:
    needs: check
    if: needs.check.outputs.status == 0
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: checkout

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype-dev zlib1g-dev ninja-build zip

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'
        cache: true

    - run: ./scripts/rebuild_linux_with_gui.sh
      name: build-for-linux

    - name: Upload Linux Build
      uses: softprops/action-gh-release@v2
      with:
        files: ./bin/lnx.zip
        tag_name: nightly-${{ needs.check.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-64:
    needs: check
    if: needs.check.outputs.status == 0
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: checkout

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'
        cache: true

    - name: Build tsMuxer
      run: |
        mkdir build
        cd build
        cmake ../ `
          -DTSMUXER_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DWITHOUT_PKGCONFIG=TRUE
        cmake --build . --config Release

        if (!(Test-Path "../bin")) { mkdir "../bin" }
        Copy-Item -Path "tsMuxer/Release/tsmuxer.exe" -Destination "../bin/tsMuxeR.exe" -Force
        if (Test-Path "tsMuxerGUI/Release/tsmuxergui.exe") {
          Copy-Item -Path "tsMuxerGUI/Release/tsmuxergui.exe" -Destination "../bin/tsMuxerGUI.exe" -Force
        }
        cd ..

    - name: Package Build
      run: |
        cd bin
        if (Test-Path "tsMuxerGUI.exe") {
          windeployqt --release --no-translations tsMuxerGUI.exe
        }
        if (Test-Path "w64.zip") { Remove-Item "w64.zip" }
        7z a -y w64.zip * '-xr!w64.zip'

    - name: Upload Windows Build
      uses: softprops/action-gh-release@v2
      with:
        files: ./bin/w64.zip
        tag_name: nightly-${{ needs.check.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-32:
    needs: check
    if: needs.check.outputs.status == 0
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: checkout

    - name: Build tsMuxer (CLI only)
      run: |
        mkdir build
        cd build
        cmake ../ `
          -A Win32 `
          -DTSMUXER_GUI=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DWITHOUT_PKGCONFIG=TRUE
        cmake --build . --config Release

        if (!(Test-Path "../bin")) { mkdir "../bin" }
        Copy-Item -Path "tsMuxer/Release/tsmuxer.exe" -Destination "../bin/tsMuxeR.exe" -Force
        cd ..

    - name: Package Build
      run: |
        cd bin
        7z a -y w32.zip tsMuxeR.exe

    - name: Upload Windows Build
      uses: softprops/action-gh-release@v2
      with:
        files: ./bin/w32.zip
        tag_name: nightly-${{ needs.check.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: check
    if: needs.check.outputs.status == 0
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
    - uses: actions/checkout@v4
      name: checkout

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'
        cache: true

    - run: ./scripts/build_macos_native.sh
      name: build-for-mac
      env:
        CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}

    - name: Rename zip with architecture
      run: mv build/bin/mac.zip build/bin/mac-${{ matrix.arch }}.zip

    - name: Upload macOS Build
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/mac-${{ matrix.arch }}.zip
        tag_name: nightly-${{ needs.check.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
