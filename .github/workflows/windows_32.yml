name: Build for Windows 32-bit

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: checkout

    # Qt6 no longer ships official 32-bit MSVC packages, so this job builds the
    # CLI only. 64-bit GUI is covered by windows_64.yml.
    - name: Build tsMuxer (CLI only)
      run: |
        mkdir build
        cd build
        cmake ../ `
          -A Win32 `
          -DTSMUXER_GUI=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DWITHOUT_PKGCONFIG=TRUE
        cmake --build . --config Release

        if (!(Test-Path "../bin")) { mkdir "../bin" }
        Copy-Item -Path "tsMuxer/Release/tsmuxer.exe" -Destination "../bin/tsMuxeR.exe" -Force
        cd ..

    - name: Package Build
      run: |
        cd bin
        7z a -y w32.zip tsMuxeR.exe

    - uses: actions/upload-artifact@v4
      with:
        name: tsMuxer-w32
        path: bin/w32.zip
        if-no-files-found: error
      name: upload-artifact

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/w32.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
