name: Build for Windows 32-bit

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      name: checkout

    # Ensure VS 2019 (v142) toolset is present for a Win7-compatible CRT.
    - name: Ensure MSVC v142 toolset
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $withV142 = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v142.x86.x64 -property installationPath
        if ($withV142) {
          Write-Host "MSVC v142 toolset already available at $withV142"
        } else {
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Installing MSVC v142 (VS 2019) toolset into $installPath ..."
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $args = "modify --installPath `"$installPath`" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --norestart"
          Start-Process -FilePath $installer -ArgumentList $args -Wait
        }

    # Qt 5.15.2 is the last official kit with Win7 + 32-bit MSVC support.
    - name: Install Qt 5.15 (Win7 / Win32)
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: win32_msvc2019
        # Multimedia is part of the Qt5.15 base kit (not a separate aqt module).
        cache: true

    - name: Build tsMuxer (Win7 GUI)
      run: |
        mkdir build
        cd build
        # v142 = VS 2019 toolset/runtime (Win7-compatible). VS 2022 CRT dropped Win7.
        cmake ../ `
          -A Win32 `
          -T v142 `
          -DTSMUXER_GUI=ON `
          -DTSMUXER_WIN7=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DWITHOUT_PKGCONFIG=TRUE
        cmake --build . --config Release

        if (!(Test-Path "../bin")) { mkdir "../bin" }
        Copy-Item -Path "tsMuxer/Release/tsmuxer.exe" -Destination "../bin/tsMuxeR.exe" -Force
        if (Test-Path "tsMuxerGUI/Release/tsmuxergui.exe") {
          Copy-Item -Path "tsMuxerGUI/Release/tsmuxergui.exe" -Destination "../bin/tsMuxerGUI.exe" -Force
        }
        cd ..

    - name: Package Build
      run: |
        cd bin
        if (Test-Path "tsMuxerGUI.exe") {
          windeployqt --release --no-translations --compiler-runtime tsMuxerGUI.exe
        }
        if (Test-Path "w32.zip") { Remove-Item "w32.zip" }
        7z a -y w32.zip * '-xr!w32.zip'

    - uses: actions/upload-artifact@v4
      with:
        name: tsMuxer-w32
        path: bin/w32.zip
        if-no-files-found: error
      name: upload-artifact

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/w32.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
